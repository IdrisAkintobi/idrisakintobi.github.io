<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1523" />
      <stop offset="100%" stop-color="#06080D" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Obsidian dark base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="#00F5FF" stroke-width="2" stroke-opacity="0.4" />
  
  <!-- Subtle green live status pulse in top-right -->
  <circle cx="51" cy="13" r="2.5" fill="#34D399" />

  <!-- High-contrast IA Monogram -->
  <!-- Letter I -->
  <path d="M17 21 H25 M21 21 V43 M17 43 H25" stroke="url(#cyanGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <!-- Letter A -->
  <path d="M33 43 L41 21 L49 43 M35.5 35.5 H46.5" stroke="url(#cyanGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>